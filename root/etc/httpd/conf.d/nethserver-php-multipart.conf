#
# Mitigation for PHP CVE-2026-109618 (GHSA-w8hw-w9fx-j79w)
#
# A multipart request without a Content-Length (chunked transfer
# encoding) skips the PHP post_max_size check and can drive PHP out of
# memory while it parses the body. Browsers always send a Content-Length
# with form uploads, so reject chunked multipart requests before they
# reach PHP. Chunked PUT requests (WebDAV uploads) are not affected.
#
<If "%{HTTP:Transfer-Encoding} =~ /chunked/i && %{HTTP:Content-Type} =~ m#^multipart/#i">
    Require all denied
</If>
